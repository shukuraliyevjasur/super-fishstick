name: Build & Push Worker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'lib/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'package*.json'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/replie-worker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/replie-worker:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Set repository variable GCP_DEPLOY=true (Settings → Variables → Actions) to enable auto-deploy
    if: vars.GCP_DEPLOY == 'true'
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            echo "Disk before cleanup:"
            df -h /
            docker system prune -af
            echo "Disk after cleanup:"
            df -h /
            docker pull ghcr.io/shukuraliyevjasur/replie-worker:latest
            docker stop replie-worker 2>/dev/null || true
            docker rm replie-worker 2>/dev/null || true
            docker run -d \
              --name replie-worker \
              --restart always \
              --env-file /etc/replie-worker.env \
              ghcr.io/shukuraliyevjasur/replie-worker:latest
            docker system prune -af
            echo "Worker restarted. Logs:"
            sleep 5
            docker logs --tail 20 replie-worker
